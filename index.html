<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영업 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #0a0b10;
    color: #f5f6fa;
  }
  .shell { display: flex; min-height: 100vh; }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: #111319;
    border-right: 1px solid rgba(255,255,255,.05);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand-dot {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(135deg,#4d7cfe,#2f5ce4);
  }
  .brand-title { font-size: 14px; font-weight: 800; }
  .brand-sub { font-size: 10px; color: #6d7488; letter-spacing: .05em; }
  .nav-group { margin-bottom: 22px; }
  .nav-label { font-size: 11px; color: #565d70; margin-bottom: 8px; padding: 0 8px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: #a7adc1; padding: 8px; border-radius: 8px; margin-bottom: 2px;
  }
  .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #3c4257; flex-shrink:0; }
  .nav-item.active { background: rgba(79,124,254,.12); color: #f5f6fa; }
  .nav-item.active .dot { background: #4d7cfe; }
  .sidebar-footer {
    margin-top: auto; display: flex; align-items: center; gap: 10px;
    padding-top: 16px; border-top: 1px solid rgba(255,255,255,.05);
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: #2f5ce4;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
  }
  .footer-name { font-size: 13px; }
  .footer-role { font-size: 11px; color: #6d7488; }

  /* ---- Main ---- */
  .main { flex: 1; padding: 24px 28px; min-width: 0; }

  .topbar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .topbar h1 { font-size: 20px; margin: 0 0 4px 0; }
  .subtitle { font-size: 12px; color: #8992a9; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .live-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(34,197,94,.12); color: #22c55e;
    padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%{opacity:1} 50%{opacity:.3} 100%{opacity:1} }
  .range-badge {
    font-size: 12px; color: #8992a9; background: #14161d;
    border: 1px solid rgba(255,255,255,.06); padding: 4px 10px; border-radius: 8px;
  }
  .month-select {
    font-size: 12px; font-weight: 600; color: #f5f6fa; background: #14161d;
    border: 1px solid rgba(255,255,255,.1); padding: 5px 10px; border-radius: 8px;
  }
  .month-select:focus { outline: 1px solid #4d7cfe; }

  /* ---- KPI cards ---- */
  .kpi-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px; margin-bottom: 16px;
  }
  .kpi-card {
    background: #14161d; border: 1px solid rgba(255,255,255,.05);
    border-radius: 14px; padding: 18px 20px;
  }
  .kpi-label { font-size: 12px; color: #8992a9; margin-bottom: 10px; }
  .kpi-value { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  .kpi-sub { font-size: 12px; color: #6d7488; }
  .kpi-bar { height: 4px; background: rgba(255,255,255,.06); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .kpi-bar-fill { height: 100%; background: linear-gradient(90deg,#4d7cfe,#2f5ce4); }

  /* ---- Panels / grid ---- */
  .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: 1fr; } }
  .panel {
    background: #14161d; border: 1px solid rgba(255,255,255,.05);
    border-radius: 14px; padding: 18px 20px; margin-bottom: 16px;
  }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .panel-head h2 { font-size: 14px; margin: 0; font-weight: 700; }
  .panel-note { font-size: 11px; color: #6d7488; }
  .vendor-select {
    background: #0f1117; color: #f5f6fa; border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; max-width: 220px;
  }
  .vendor-select:focus { outline: 1px solid #4d7cfe; }
  .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* ---- Weekly bar chart ---- */
  .chart-legend { display: flex; gap: 16px; margin-bottom: 8px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8992a9; }
  .legend-swatch { width: 14px; height: 3px; border-radius: 2px; background: #4d7cfe; }
  .legend-swatch.target { background: none; border-top: 2px dashed #6d7488; }
  .bar-chart { display: flex; align-items: flex-end; gap: 16px; height: 200px; padding-top: 10px; position: relative; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
  .bar-value-label { font-size: 11px; color: #a7adc1; margin-bottom: 6px; }
  .bar {
    width: 100%; max-width: 56px; border-radius: 6px 6px 0 0;
    background: linear-gradient(180deg,#4d7cfe,#2f5ce4);
  }
  .bar.last { box-shadow: 0 0 0 2px rgba(79,124,254,.35); }
  .bar-label { font-size: 12px; color: #8992a9; margin-top: 8px; }
  .target-line {
    position: absolute; left: 4px; right: 4px; height: 0;
    border-top: 2px dashed #9aa2b8;
  }

  /* ---- Funnel ---- */
  .funnel { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0; }
  .funnel-row { width: 100%; }
  .funnel-bar {
    height: 42px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    color: white; font-size: 12px; font-weight: 600; padding: 0 10px; text-align: center;
    background: linear-gradient(90deg,#4d7cfe,#2f5ce4);
  }

  /* ---- Rank list ---- */
  .rank-list { display: flex; flex-direction: column; }
  .rank-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-num {
    width: 22px; height: 22px; border-radius: 6px; background: rgba(79,124,254,.15);
    color: #8ab0ff; font-size: 11px; font-weight: 700; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .rank-num.top1 { background: #2f5ce4; color: white; }
  .rank-name {
    width: 110px; font-size: 13px; flex-shrink: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .rank-track { flex: 1; height: 8px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; }
  .rank-fill { height: 100%; background: linear-gradient(90deg,#4d7cfe,#2f5ce4); border-radius: 4px; }
  .rank-value { width: 110px; text-align: right; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .rank-share { width: 52px; text-align: right; font-size: 12px; color: #8992a9; flex-shrink: 0; }

  /* ---- Calendar ---- */
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .calendar-dow { text-align: center; font-size: 11px; color: #6d7488; padding-bottom: 4px; }
  .calendar-cell {
    background: #0f1117; border: 1px solid rgba(255,255,255,.05); border-radius: 8px;
    padding: 8px 6px; min-height: 64px; display: flex; flex-direction: column; gap: 4px;
  }
  .calendar-cell.empty { background: transparent; border: none; }
  .calendar-day { font-size: 11px; color: #6d7488; }
  .calendar-amount { font-size: 12px; font-weight: 700; color: #f5f6fa; }

  /* ---- Tables ---- */
  .scroll-box { max-height: 420px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; color: #c7cbe0; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.05); }
  th { font-size: 11px; color: #6d7488; font-weight: 600; position: sticky; top: 0; background: #14161d; }
  td.num, th.num { text-align: right; }
  .error { color: #f24444; }
</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-dot"></div>
        <div>
          <div class="brand-title">매출관리</div>
          <div class="brand-sub">SALES OPS</div>
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-label">활동</div>
        <div class="nav-item active"><span class="dot"></span>대시보드</div>
        <div class="nav-item"><span class="dot"></span>판매처</div>
        <div class="nav-item"><span class="dot"></span>상품</div>
      </div>
      <div class="nav-group">
        <div class="nav-label">데이터</div>
        <div class="nav-item"><span class="dot"></span>거래 내역</div>
        <div class="nav-item"><span class="dot"></span>리포트</div>
      </div>
      <div class="sidebar-footer">
        <div class="avatar">H</div>
        <div>
          <div class="footer-name">hyosun</div>
          <div class="footer-role">대표</div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>영업 대시보드</h1>
          <div class="subtitle" id="subtitle">불러오는 중...</div>
        </div>
        <div class="topbar-right">
          <span class="live-badge"><span class="live-dot"></span>LIVE</span>
          <select id="monthSelect" class="month-select"></select>
        </div>
      </div>

      <section class="kpi-row" id="cards"></section>

      <section class="grid-2">
        <div class="panel">
          <div class="panel-head">
            <h2>영업팀 주별 매출 추이</h2>
            <span class="panel-note">단위: 원</span>
          </div>
          <div class="chart-legend">
            <span class="legend-item"><span class="legend-swatch"></span>실적</span>
            <span class="legend-item"><span class="legend-swatch target"></span>목표</span>
          </div>
          <div class="bar-chart" id="weeklyChart"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h2>판매처 매출 비중 TOP 5</h2>
            <span class="panel-note" id="vendorTotalBadge"></span>
          </div>
          <div class="funnel" id="vendorFunnel"></div>
        </div>
      </section>

      <section class="grid-3">
        <div class="panel">
          <div class="panel-head"><h2>판매처별 매출 TOP 5</h2></div>
          <div class="rank-list" id="vendorRankList"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h2>브랜드별 매출 합산 TOP 5</h2>
            <span class="panel-note" id="brandTotalBadge"></span>
          </div>
          <div class="rank-list" id="brandRankList"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h2>제품별 매출 TOP 5</h2>
            <span class="panel-note" id="productTotalBadge"></span>
          </div>
          <div class="rank-list" id="productRankList"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>판매처별 상세</h2>
          <div class="filter-group">
            <select id="vendorSelect" class="vendor-select"></select>
            <select id="productSelect" class="vendor-select"></select>
            <span class="panel-note" id="filterCount"></span>
          </div>
        </div>
        <div class="scroll-box">
          <table>
            <thead><tr><th>판매처</th><th>제품명</th><th class="num">수량</th><th class="num">매출</th></tr></thead>
            <tbody id="vendorDetailTable"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>제품별 상세 (전체)</h2></div>
        <div class="scroll-box">
          <table>
            <thead><tr><th>제품</th><th class="num">수량</th><th class="num">금액</th></tr></thead>
            <tbody id="productTable"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>전체 판매 내역</h2>
          <span class="panel-note" id="calendarMonthLabel"></span>
        </div>
        <div class="calendar" id="salesCalendar"></div>
      </section>
    </main>
  </div>

<script>
  // ---- Supabase 연결 정보 ----
  const SUPABASE_URL = 'https://fwsszzjfjktliredmjcn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_uE-8s2DbZBUSs0z1uQ-nIA_za2Ah3uT';

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---- 목표 매출 (매월 동일 적용) ----
  const COMPANY_MONTHLY_TARGET = 9000000000; // 전사 월 90억원
  const COMPANY_DAILY_TARGET = 900000000;    // 전사 일 9억원
  const TEAM_MONTHLY_TARGET = 900000000;     // 영업팀 월 9억원
  const TEAM_DAILY_TARGET = 30000000;        // 영업팀 일 3천만원

  // 영업팀 매출 실적 (엑셀 월별 탭 기준 고정값, 월별로 다르게 입력)
  // 여기에 없는 달은 자동 계산값(EXCLUDED_FROM_TEAM 기준)을 사용합니다.
  const TEAM_ACTUALS_BY_MONTH = {
    '2026-06': { monthly: 538730164, daily: 17957672 },
    '2026-07': { monthly: 749145885, daily: 24165996 },
    '2026-08': { monthly: 54460810 }, // daily 미지정 시 실제 거래일수로 나눠 자동 계산
  };

  // 전사(회사 전체) 매출 실적 고정값 (엑셀 브별/월별 총합계 탭 기준, 몰별 거래 데이터 합계와는
  // 소수 반영 시점 차이로 약간의 오차가 있을 수 있어 정확한 수치를 직접 넣습니다)
  // 여기에 없는 달은 Supabase 거래 데이터 합계(totalAmount)를 그대로 사용합니다.
  const COMPANY_ACTUALS_BY_MONTH = {
    '2026-07': 3799388633,
  };

  // 브랜드별 매출 실적 고정값 (엑셀 브별 탭에서 직접 확인한 수치, 월별로 다르게 입력)
  // 여기에 있는 달은 이 표를 그대로 랭킹에 사용하고, 없는 달은 자동 집계(byBrand)를 사용합니다.
  // 참고: 브별 시트의 "라스마"는 "라이프스타일마트"의 다른 표기입니다.
  const BRAND_ACTUALS_BY_MONTH = {
    '2026-07': {
      '미니멀룸': 172870625,
      '라이프스타일마트': 950407270,
      '빠이러스': 117199960,
      '그로우뮤즈': 22126300,
      '폴크': 1333780,
      '잠비에': 60862810,
      '글로리핏': 2680480,
      '명퉤': 702598938,
      '코드니처': 1769308470,
    },
  };

  // 영업팀 매출 = 자사몰 / 카카오 / 오프라인 / 컨텐츠팀 채널을 제외한 매출
  // (종합몰 · 폐쇄몰 · 오픈마켓 · 기타(쿠팡) · 직매입 · 수출 · 공동구매 채널은 영업팀 매출로 집계됨)
  const EXCLUDED_FROM_TEAM = [
    // 자사몰 채널
    '그로우뮤즈', '글로리핏', '라이프스타일마트', '명퉤', '명퉤(해외)', '멜루션', '미니멀룸',
    '빠이러스', '빠이러스(도착보장)', '스토어팜(명퉤)', '스토어팜(미니멀룸스토어)', '스토어팜(빠이러스_법인)',
    '스토어팜(빠이러스_개인)', '스토어팜(잠비에)', '스토어팜(코드니처)', '잠비에', '코드니처', 'PORKE.',
    // 카카오 선물하기(개인) 채널
    '카카오선물하기(개인)', '카카오선물하기(개인)_폴크', '카카오톡스토어(법인)',
    // 오프라인
    '명퉤 경주 황리단길 본점',
    // 컨텐츠팀 채널
    '공동구매(컨텐츠팀)',
  ];

  function won(n) {
    return Number(n).toLocaleString('ko-KR') + '원';
  }

  // 판매처(채널별 세부 계정)를 하나의 브랜드로 합산하기 위한 매핑
  // 자사몰/스토어팜/특정 채널 전용 계정 등 같은 브랜드의 다른 채널 계정을 한 브랜드로 묶습니다.
  // 매핑에 없는 판매처는 그대로 자기 자신을 브랜드명으로 사용합니다.
  const BRAND_ALIASES = {
    '스토어팜(빠이러스_개인)': '빠이러스', '스토어팜(빠이러스_법인)': '빠이러스', '빠이러스(도착보장)': '빠이러스',
    '스토어팜(미니멀룸스토어)': '미니멀룸', '오늘의집(미니멀룸)': '미니멀룸',
    '스토어팜(잠비에)': '잠비에', '잠비에_공동구매': '잠비에', '오늘의집(잠비에)': '잠비에',
    '스토어팜(코드니처)': '코드니처', '코드니처_공동구매': '코드니처',
    '스토어팜(명퉤)': '명퉤', '명퉤(해외)': '명퉤', '명퉤 경주 황리단길 본점': '명퉤',
    'PORKE.': 'PORKE', '29CM(PORKE)': 'PORKE', 'W컨셉(PORKE)': 'PORKE', '오늘의집(PORKE)': 'PORKE',
    '무신사(PORKE)': 'PORKE', '지그재그(PORKE)': 'PORKE',
  };
  function getBrandFallback(vendor) {
    return BRAND_ALIASES[vendor] || vendor;
  }
  // 일매출 DB 원본에 브랜드 태그(row.brand)가 있으면 그걸 그대로 쓰고,
  // 없는 경우(6월/7월처럼 브랜드 정보가 없는 옛 데이터)에만 판매처 이름 기반 추정값을 사용합니다.
  function getBrand(row) {
    if (row.brand && String(row.brand).trim()) return String(row.brand).trim();
    return getBrandFallback(row.vendor);
  }

  let allRows = [];

  async function loadData() {
    // Supabase는 한 번에 최대 1000행만 돌려주므로 나눠서 전부 가져옵니다.
    const pageSize = 1000;
    let from = 0;
    let all = [];
    while (true) {
      const { data, error } = await client
        .from('sales_transactions')
        .select('*')
        .order('sale_date', { ascending: true })
        .range(from, from + pageSize - 1);

      if (error) {
        document.getElementById('subtitle').innerHTML =
          '<span class="error">데이터를 불러오지 못했습니다: ' + error.message + '</span>';
        return;
      }
      all = all.concat(data || []);
      if (!data || data.length < pageSize) break;
      from += pageSize;
    }
    allRows = all;
    setupMonthSelector();
  }

  function setupMonthSelector() {
    const monthSelect = document.getElementById('monthSelect');
    const months = Array.from(new Set(allRows.map(r => r.sale_date.slice(0, 7)))).sort();
    const prevSelected = monthSelect.value;

    monthSelect.innerHTML = months.map(m => {
      const [y, mm] = m.split('-');
      return `<option value="${m}">${y}년 ${Number(mm)}월</option>`;
    }).join('');

    const monthToShow = months.includes(prevSelected) ? prevSelected : (months[months.length - 1] || '');
    monthSelect.value = monthToShow;
    monthSelect.onchange = () => renderMonth(monthSelect.value);

    renderMonth(monthToShow);
  }

  function renderMonth(monthStr) {
    const rows = monthStr ? allRows.filter(r => r.sale_date.slice(0, 7) === monthStr) : allRows;
    render(rows, monthStr);
  }

  function render(rows, monthStr) {
    const totalAmount = rows.reduce((s, r) => s + Number(r.amount), 0);
    const totalQty = rows.reduce((s, r) => s + Number(r.quantity), 0);

    const byVendor = {};
    const byProduct = {};
    const byVendorProduct = {};
    const byBrand = {};
    rows.forEach(r => {
      if (!byVendor[r.vendor]) byVendor[r.vendor] = { amount: 0, quantity: 0 };
      byVendor[r.vendor].amount += Number(r.amount);
      byVendor[r.vendor].quantity += Number(r.quantity);

      if (!byProduct[r.product_name]) byProduct[r.product_name] = { amount: 0, quantity: 0 };
      byProduct[r.product_name].amount += Number(r.amount);
      byProduct[r.product_name].quantity += Number(r.quantity);

      if (!byVendorProduct[r.vendor]) byVendorProduct[r.vendor] = {};
      if (!byVendorProduct[r.vendor][r.product_name]) byVendorProduct[r.vendor][r.product_name] = { amount: 0, quantity: 0 };
      byVendorProduct[r.vendor][r.product_name].amount += Number(r.amount);
      byVendorProduct[r.vendor][r.product_name].quantity += Number(r.quantity);

      const brand = getBrand(r);
      if (!byBrand[brand]) byBrand[brand] = { amount: 0, quantity: 0 };
      byBrand[brand].amount += Number(r.amount);
      byBrand[brand].quantity += Number(r.quantity);
    });

    const dates = rows.map(r => r.sale_date).sort();
    const minDate = dates[0];
    const maxDate = dates[dates.length - 1];
    const dayCount = new Set(dates).size || 1;

    document.getElementById('subtitle').textContent =
      (minDate && maxDate ? minDate + ' ~ ' + maxDate + ' · ' : '') +
      '실시간 집계 · 거래 ' + rows.length.toLocaleString('ko-KR') + '건';

    const vendorEntries = Object.entries(byVendor).sort((a, b) => b[1].amount - a[1].amount);
    const productEntries = Object.entries(byProduct).sort((a, b) => b[1].amount - a[1].amount);
    const topVendor = vendorEntries[0];
    const topProduct = productEntries[0];

    // ---- 목표 대비 계산 ----
    const dailyAvg = totalAmount / dayCount;

    const byDate = {};
    const byDateTeam = {};
    let teamAmount = 0;
    rows.forEach(r => {
      byDate[r.sale_date] = (byDate[r.sale_date] || 0) + Number(r.amount);
      if (!EXCLUDED_FROM_TEAM.includes(r.vendor)) {
        byDateTeam[r.sale_date] = (byDateTeam[r.sale_date] || 0) + Number(r.amount);
        teamAmount += Number(r.amount);
      }
    });
    const todayDate = maxDate;
    const todayAmount = byDate[todayDate] || 0;
    const teamTodayAmount = byDateTeam[todayDate] || 0;

    // 해당 월의 고정 실적값이 있으면 그 값을, 없으면 Supabase 거래 데이터 합계(totalAmount)를 사용
    const companyOverride = monthStr && COMPANY_ACTUALS_BY_MONTH[monthStr];
    const companyMonthlyActual = companyOverride !== undefined ? companyOverride : totalAmount;

    const companyMonthlyPct = Math.min(999, (companyMonthlyActual / COMPANY_MONTHLY_TARGET) * 100);
    const companyMonthlyRemain = Math.max(0, COMPANY_MONTHLY_TARGET - companyMonthlyActual);
    const companyDailyPct = Math.min(999, (todayAmount / COMPANY_DAILY_TARGET) * 100);

    // 해당 월의 고정 실적값이 있으면 그 값을, 없으면 자동 계산값(teamAmount)을 사용
    const teamOverride = monthStr && TEAM_ACTUALS_BY_MONTH[monthStr];
    const teamMonthlyActual = teamOverride ? teamOverride.monthly : teamAmount;
    const teamDailyAvgActual = teamOverride
      ? (teamOverride.daily !== undefined ? teamOverride.daily : teamOverride.monthly / dayCount)
      : (teamAmount / dayCount);

    const teamMonthlyPct = Math.min(999, (teamMonthlyActual / TEAM_MONTHLY_TARGET) * 100);
    const teamMonthlyRemain = Math.max(0, TEAM_MONTHLY_TARGET - teamMonthlyActual);
    const teamDailyPct = Math.min(999, (teamDailyAvgActual / TEAM_DAILY_TARGET) * 100);

    // ---- KPI 카드 ----
    document.getElementById('cards').innerHTML = `
      <div class="kpi-card">
        <div class="kpi-label">이번 달 매출</div>
        <div class="kpi-value">${won(companyMonthlyActual)}</div>
        <div class="kpi-sub">목표 90억 대비 ${companyMonthlyPct.toFixed(1)}% · ${won(companyMonthlyRemain)} 남음</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.min(100, companyMonthlyPct).toFixed(1)}%"></div></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">오늘 매출 (${todayDate || '-'})</div>
        <div class="kpi-value">${won(todayAmount)}</div>
        <div class="kpi-sub">일매출 목표 9억 대비 ${companyDailyPct.toFixed(1)}%</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.min(100, companyDailyPct).toFixed(1)}%"></div></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">영업팀 매출</div>
        <div class="kpi-value">${won(teamMonthlyActual)}</div>
        <div class="kpi-sub">목표 9억 대비 ${teamMonthlyPct.toFixed(1)}% · ${won(teamMonthlyRemain)} 남음</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.min(100, teamMonthlyPct).toFixed(1)}%"></div></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">영업팀 일매출 (평균)</div>
        <div class="kpi-value">${won(Math.round(teamDailyAvgActual))}</div>
        <div class="kpi-sub">일매출 목표 3천만원 대비 ${teamDailyPct.toFixed(1)}%</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.min(100, teamDailyPct).toFixed(1)}%"></div></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">일평균 매출 · 총 거래 건수</div>
        <div class="kpi-value">${won(Math.round(dailyAvg))}</div>
        <div class="kpi-sub">총 ${rows.length.toLocaleString('ko-KR')}건 · 판매처 ${vendorEntries.length}곳 · 제품 ${productEntries.length}종</div>
      </div>
    `;

    // ---- 영업팀 주별 매출 추이 (해당 월 1~7,8~14,15~21,22~28,29~31일 5개 구간) ----
    const weekBuckets = [0, 0, 0, 0, 0];
    rows.forEach(r => {
      if (EXCLUDED_FROM_TEAM.includes(r.vendor)) return;
      const day = Number(r.sale_date.split('-')[2]);
      const idx = Math.min(4, Math.floor((day - 1) / 7));
      weekBuckets[idx] += Number(r.amount);
    });
    // 구간별 목표 = 일 목표 x 해당 구간의 달력상 일수 (실제 데이터 유무와 무관)
    const daysInSelectedMonth = minDate
      ? new Date(Number(minDate.split('-')[0]), Number(minDate.split('-')[1]), 0).getDate()
      : 31;
    const bucketDayCounts = [0, 0, 0, 0, 0].map((_, i) => {
      const start = i * 7 + 1;
      const end = Math.min(daysInSelectedMonth, start + 6);
      return Math.max(0, end - start + 1);
    });
    const weekTargets = bucketDayCounts.map(d => d * TEAM_DAILY_TARGET);
    const maxWeek = Math.max(...weekBuckets, ...weekTargets, 1);
    const weekLabels = ['1~7일', '8~14일', '15~21일', '22~28일', '29일~31일'];
    document.getElementById('weeklyChart').innerHTML = weekBuckets.map((amt, i) => `
      <div class="bar-col">
        <div class="bar-value-label">${amt > 0 ? won(amt) : ''}</div>
        <div class="target-line" style="bottom:${(weekTargets[i] / maxWeek * 100).toFixed(1)}%"></div>
        <div class="bar ${i === weekBuckets.length - 1 ? 'last' : ''}" style="height:${(amt / maxWeek * 100).toFixed(1)}%"></div>
        <div class="bar-label">${weekLabels[i]}</div>
      </div>
    `).join('');

    // ---- 판매처 매출 비중 TOP5 (퍼널) ----
    const top5Vendor = vendorEntries.slice(0, 5);
    const maxTop5 = top5Vendor.length ? top5Vendor[0][1].amount : 1;
    document.getElementById('vendorTotalBadge').textContent = '전체 ' + vendorEntries.length + '곳 중';
    document.getElementById('vendorFunnel').innerHTML = top5Vendor.map(([vendor, v], i) => {
      const widthPct = 40 + (v.amount / maxTop5) * 60; // 40%~100% 범위로 퍼널 느낌
      return `
        <div class="funnel-row" style="width:${widthPct.toFixed(1)}%">
          <div class="funnel-bar">${vendor} · ${won(v.amount)}</div>
        </div>
      `;
    }).join('');

    // ---- 판매처별 매출 TOP5 랭킹 ----
    document.getElementById('vendorRankList').innerHTML = top5Vendor.map(([vendor, v], i) => {
      const share = (v.amount / totalAmount * 100).toFixed(1);
      return `
        <div class="rank-row">
          <div class="rank-num ${i === 0 ? 'top1' : ''}">${i + 1}</div>
          <div class="rank-name">${vendor}</div>
          <div class="rank-track"><div class="rank-fill" style="width:${(v.amount / maxTop5 * 100).toFixed(1)}%"></div></div>
          <div class="rank-value">${won(v.amount)}</div>
          <div class="rank-share">${share}%</div>
        </div>
      `;
    }).join('');

    // ---- 브랜드별 매출 합산 TOP5 랭킹 (채널별 세부 계정을 브랜드 단위로 합산) ----
    // 해당 월의 고정 실적표가 있으면 그 값을, 없으면 자동 집계(byBrand)를 사용
    const brandOverride = monthStr && BRAND_ACTUALS_BY_MONTH[monthStr];
    const brandEntries = brandOverride
      ? Object.entries(brandOverride).map(([brand, amt]) => [brand, { amount: amt, quantity: null }]).sort((a, b) => b[1].amount - a[1].amount)
      : Object.entries(byBrand).sort((a, b) => b[1].amount - a[1].amount);
    const top5Brand = brandEntries.slice(0, 5);
    const maxTop5Brand = top5Brand.length ? top5Brand[0][1].amount : 1;
    document.getElementById('brandTotalBadge').textContent = '전체 ' + brandEntries.length + '개 중';
    document.getElementById('brandRankList').innerHTML = top5Brand.map(([brand, v], i) => {
      const share = (v.amount / totalAmount * 100).toFixed(1);
      return `
        <div class="rank-row">
          <div class="rank-num ${i === 0 ? 'top1' : ''}">${i + 1}</div>
          <div class="rank-name">${brand}</div>
          <div class="rank-track"><div class="rank-fill" style="width:${(v.amount / maxTop5Brand * 100).toFixed(1)}%"></div></div>
          <div class="rank-value">${won(v.amount)}</div>
          <div class="rank-share">${share}%</div>
        </div>
      `;
    }).join('');

    // ---- 제품별 매출 TOP5 랭킹 ----
    const top5Product = productEntries.slice(0, 5);
    const maxTop5Product = top5Product.length ? top5Product[0][1].amount : 1;
    document.getElementById('productTotalBadge').textContent = '전체 ' + productEntries.length + '종 중';
    document.getElementById('productRankList').innerHTML = top5Product.map(([product, v], i) => {
      const share = (v.amount / totalAmount * 100).toFixed(1);
      return `
        <div class="rank-row">
          <div class="rank-num ${i === 0 ? 'top1' : ''}">${i + 1}</div>
          <div class="rank-name">${product}</div>
          <div class="rank-track"><div class="rank-fill" style="width:${(v.amount / maxTop5Product * 100).toFixed(1)}%"></div></div>
          <div class="rank-value">${won(v.amount)}</div>
          <div class="rank-share">${share}%</div>
        </div>
      `;
    }).join('');

    // ---- 판매처별 상세 (판매처 + 제품명 드롭박스로 필터) ----
    const ALL_VALUE = '';
    const vendorSelect = document.getElementById('vendorSelect');
    const productSelect = document.getElementById('productSelect');
    const filterCount = document.getElementById('filterCount');

    const prevVendor = vendorSelect.value;
    vendorSelect.innerHTML = `<option value="${ALL_VALUE}">전체 판매처</option>` + vendorEntries.map(([vendor, v]) =>
      `<option value="${vendor}">${vendor} (${won(v.amount)})</option>`
    ).join('');
    vendorSelect.value = (prevVendor && byVendorProduct[prevVendor]) ? prevVendor : ALL_VALUE;

    function productOptionsFor(vendor) {
      if (!vendor) return productEntries; // 전체 판매처 → 전체 제품 목록
      const products = byVendorProduct[vendor] || {};
      return Object.entries(products).sort((a, b) => b[1].amount - a[1].amount);
    }

    function refreshProductSelect(keepSelection) {
      const prevProduct = keepSelection ? productSelect.value : ALL_VALUE;
      const opts = productOptionsFor(vendorSelect.value);
      const stillValid = opts.some(([p]) => p === prevProduct);
      productSelect.innerHTML = `<option value="${ALL_VALUE}">전체 제품</option>` + opts.map(([product, v]) =>
        `<option value="${product}">${product} (${won(v.amount)})</option>`
      ).join('');
      productSelect.value = stillValid ? prevProduct : ALL_VALUE;
    }

    function renderVendorDetail() {
      const vendor = vendorSelect.value;
      const product = productSelect.value;
      const vendorsToScan = vendor ? [vendor] : Object.keys(byVendorProduct);
      let flatRows = [];
      vendorsToScan.forEach(v => {
        const prodMap = byVendorProduct[v] || {};
        Object.entries(prodMap).forEach(([p, val]) => {
          if (product && p !== product) return;
          flatRows.push({ vendor: v, product: p, quantity: val.quantity, amount: val.amount });
        });
      });
      flatRows.sort((a, b) => b.amount - a.amount);

      filterCount.textContent = flatRows.length.toLocaleString('ko-KR') + '건';
      document.getElementById('vendorDetailTable').innerHTML = flatRows.map(r => `
        <tr>
          <td>${r.vendor}</td>
          <td>${r.product}</td>
          <td class="num">${r.quantity.toLocaleString('ko-KR')}</td>
          <td class="num">${won(r.amount)}</td>
        </tr>
      `).join('');
    }

    refreshProductSelect(false);
    vendorSelect.onchange = () => { refreshProductSelect(false); renderVendorDetail(); };
    productSelect.onchange = () => renderVendorDetail();
    renderVendorDetail();

    // ---- 제품별 표 (전체) ----
    document.getElementById('productTable').innerHTML = productEntries.map(([product, v]) => `
      <tr>
        <td>${product}</td>
        <td class="num">${v.quantity.toLocaleString('ko-KR')}</td>
        <td class="num">${won(v.amount)}</td>
      </tr>
    `).join('');

    // ---- 전체 판매 내역: 캘린더 형태로 일별 매출만 표시 ----
    if (minDate) {
      const [y, m] = minDate.split('-').map(Number);
      const firstWeekday = new Date(y, m - 1, 1).getDay(); // 0=일 ~ 6=토
      const daysInMonth = new Date(y, m, 0).getDate();
      const maxDayAmount = Math.max(...Object.values(byDate), 1);

      document.getElementById('calendarMonthLabel').textContent = y + '.' + String(m).padStart(2, '0');

      const dowRow = ['일', '월', '화', '수', '목', '금', '토']
        .map(d => `<div class="calendar-dow">${d}</div>`).join('');

      let cells = '';
      for (let i = 0; i < firstWeekday; i++) cells += `<div class="calendar-cell empty"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        const amount = byDate[dateStr] || 0;
        const alpha = amount > 0 ? (0.15 + 0.65 * (amount / maxDayAmount)) : 0;
        const bg = amount > 0 ? `background: rgba(77,124,254,${alpha.toFixed(2)});` : '';
        cells += `
          <div class="calendar-cell" style="${bg}">
            <div class="calendar-day">${d}</div>
            <div class="calendar-amount">${amount > 0 ? won(amount) : ''}</div>
          </div>
        `;
      }

      document.getElementById('salesCalendar').innerHTML = dowRow + cells;
    }
  }

  loadData();
</script>
</body>
</html>
