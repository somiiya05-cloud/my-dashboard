name: 네이버 키워드/캠페인 일별 동기화 호출

# api/sync-naver-keywords.js를 mode=daily로 호출해서, 캠페인·키워드 성과를 하루 단위로
# naver_keyword_performance_daily / naver_campaign_performance_daily에 쌓는다.
# 매일 스케줄로는 어제 하루만 처리하고, workflow_dispatch에 from/to를 채우면 그 기간을
# (계정×조각 잡 안에서) 하루씩 순회하며 백필한다 — Vercel 함수는 여전히 하루짜리 호출
# 하나씩만 처리하니 60초 제한과 무관하다.

on:
  schedule:
    # 매일 UTC 05:30(한국 14:30) — 월간 동기화(05:00) 10분 뒤
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: '백필 시작일(YYYY-MM-DD). 비워두면 어제 하루만 실행.'
        required: false
        default: ''
      to:
        description: '백필 종료일(YYYY-MM-DD). from을 채웠는데 비워두면 어제까지.'
        required: false
        default: ''

# ⚠ 2026-09-12: 이 워크플로가 2026-09-10 이후 15번 연속 실패했다.
#   원인은 네이버 광고 API 호출 한도 — `GET /ncc/keywords (429) Too Many Requests`.
#   계정2 조각 6개가 **동시에** 같은 네이버 계정을 때리는 데다, 대시보드의
#   「지금 동기화」 버튼은 월 단위 워크플로(ping-naver-keywords-sync.yml)까지
#   같이 띄워서 한 계정에 최대 12조각이 한꺼번에 붙었다.
#   그래서 (1) 두 워크플로를 같은 concurrency 그룹으로 묶어 절대 겹치지 않게 하고,
#          (2) matrix 를 max-parallel: 1 로 바꿔 조각을 하나씩 순서대로 돌린다.
#   조각당 최대 90초라 전부 도는 데 몇 분 더 걸리지만, 실패해서 아무것도 안 들어오는
#   것보다 낫다. 한도가 늘어나면 max-parallel 을 2~3 으로 올려보면 된다.
concurrency:
  group: naver-keywords-sync
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1   # 조각을 동시에 돌리면 네이버 API 429 (위 설명 참고)
      fail-fast: false
      matrix:
        include:
          - account: '1'
            shard: 0
            shards: 1
          - account: '2'
            shard: 0
            shards: 6
          - account: '2'
            shard: 1
            shards: 6
          - account: '2'
            shard: 2
            shards: 6
          - account: '2'
            shard: 3
            shards: 6
          - account: '2'
            shard: 4
            shards: 6
          - account: '2'
            shard: 5
            shards: 6
    steps:
      - name: "날짜별 Vercel sync 엔드포인트 호출 (계정${{ matrix.account }}, 조각 ${{ matrix.shard }}/${{ matrix.shards }})"
        run: |
          FROM="${{ github.event.inputs.from }}"
          TO="${{ github.event.inputs.to }}"
          if [ -z "$FROM" ]; then
            FROM=$(TZ=Asia/Seoul date -d 'yesterday' +%F)
          fi
          if [ -z "$TO" ]; then
            TO="$FROM"
          fi
          echo "처리 범위: $FROM ~ $TO"
          D="$FROM"
          while :; do
            URL="${{ secrets.VERCEL_APP_URL }}/api/sync-naver-keywords?mode=daily&date=${D}&account=${{ matrix.account }}&shard=${{ matrix.shard }}&shards=${{ matrix.shards }}"
            echo "=== $D ==="
            HTTP_CODE=$(curl -s --max-time 90 -o response.json -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$URL")
            echo "HTTP status: $HTTP_CODE"
            cat response.json
            echo
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then exit 1; fi
            if [ "$D" = "$TO" ]; then break; fi
            D=$(date -d "$D + 1 day" +%F)
            sleep 2
          done
