name: 자사몰 검수

# 자사몰 9곳의 sitemap.xml 을 읽어
#   · 어제 없던 상품이 생겼는지 (신규 상품 알림)
#   · 숨어 있어야 할 히든링크가 공개 목록에 떴는지 (노출 사고)
# 를 확인해 Supabase의 mall_audits 표에 넣습니다.
#
# 다른 동기화들과 달리 Vercel 엔드포인트를 부르지 않고 여기서 직접 돕니다.
# Vercel 무료 플랜은 배포당 서버리스 함수가 12개까지인데 이미 12개를 다 쓰고 있어서,
# 함수를 하나 더 추가하면 배포 자체가 실패하기 때문입니다.
# 이 검수는 "사이트 읽기 + Supabase 저장"뿐이라 러너에서 그냥 돌리면 됩니다.
#
# 실제 로직은 전부 scripts/mall-audit.js 안에 있습니다.

on:
  schedule:
    # 매일 아침 KST 09:10 (UTC 00:10). 출근해서 대시보드를 열면 이미 검수가 끝나 있게 합니다.
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식'
        required: true
        type: choice
        default: '검수 (대시보드에 반영)'
        options:
          - '검수 (대시보드에 반영)'
          - '확인만 (저장 안 함)'
          - '히든링크 재탐색 (숨은 상품 목록 갱신)'
      brand:
        description: '특정 몰만 볼 때 브랜드명 (예: 멜루션). 평소에는 비워두세요.'
        required: false
        default: ''

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 자사몰 검수 실행
        env:
          # 스케줄 실행은 inputs 가 비어 있으므로 기본값 audit 으로 돕니다.
          MODE_LABEL: ${{ github.event.inputs.mode }}
          MALL_AUDIT_BRAND: ${{ github.event.inputs.brand }}
          # 없으면 스크립트가 대시보드와 같은 공개 키를 씁니다(mall_* 표는 공개 정책).
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          case "$MODE_LABEL" in
            확인만*)   export MALL_AUDIT_MODE=debug ;;
            히든링크*) export MALL_AUDIT_MODE=discover ;;
            *)         export MALL_AUDIT_MODE=audit ;;
          esac
          echo "실행 방식: $MALL_AUDIT_MODE"
          node scripts/mall-audit.js
