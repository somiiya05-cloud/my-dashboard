name: 자사몰 검수 호출

# Vercel Hobby 플랜의 cron 한도를 이미 다 쓰고 있어서(sync-meta-ads 등),
# 다른 동기화들과 마찬가지로 GitHub Actions가 매일 엔드포인트를 호출해 실행합니다.
# 실제 로직은 전부 api/sync-mall-audit.js 안에 있고, 여기서는 깨우기만 합니다.
#
# 하는 일: 자사몰 9곳의 sitemap.xml 을 읽어
#   · 어제 없던 상품이 생겼는지 (신규 상품 알림)
#   · 숨어 있어야 할 히든링크가 공개 목록에 떴는지 (노출 사고)
# 를 확인해 Supabase의 mall_audits 표에 넣습니다.

on:
  schedule:
    # 매일 아침 KST 09:10 (UTC 00:10). 출근해서 대시보드를 열면 이미 검수가 끝나 있게 합니다.
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식'
        required: true
        type: choice
        default: '검수 (대시보드에 반영)'
        options:
          - '검수 (대시보드에 반영)'
          - '확인만 (저장 안 함)'
          - '히든링크 재탐색 (숨은 상품 목록 갱신)'
      brand:
        description: '특정 몰만 볼 때 브랜드명 (예: 멜루션). 평소에는 비워두세요.'
        required: false
        default: ''

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel 검수 엔드포인트 호출
        run: |
          URL="${{ secrets.VERCEL_APP_URL }}/api/sync-mall-audit"
          MODE="${{ github.event.inputs.mode }}"
          BRAND="${{ github.event.inputs.brand }}"
          SEP="?"
          # 스케줄 실행은 mode가 비어 있으므로 항상 검수(저장) 모드로 돕니다.
          case "$MODE" in
            확인만*)        URL="${URL}${SEP}debug=1";    SEP="&" ;;
            히든링크*)      URL="${URL}${SEP}discover=1"; SEP="&" ;;
          esac
          if [ -n "$BRAND" ]; then
            ENCODED=$(printf '%s' "$BRAND" | od -An -tx1 | tr -d ' \n' | sed 's/../%&/g')
            URL="${URL}${SEP}brand=${ENCODED}"
          fi
          HTTP_CODE=$(curl -s --max-time 120 -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$URL")
          echo "HTTP status: $HTTP_CODE"
          cat response.json
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then exit 1; fi

      - name: 노출 사고가 있으면 실행 요약에 크게 띄우기
        if: always()
        run: |
          EXPOSED=$(grep -oE '"exposed_total":[0-9]+' response.json | grep -oE '[0-9]+' || echo 0)
          NEW=$(grep -oE '"new_total":[0-9]+' response.json | grep -oE '[0-9]+' || echo 0)
          {
            echo "## 자사몰 검수 결과"
            echo ""
            echo "- 새로 등록된 상품: **${NEW}건**"
            echo "- 히든링크 노출: **${EXPOSED}건**"
            echo ""
            if [ "${EXPOSED:-0}" -gt 0 ]; then
              echo "> ⚠️ 숨어 있어야 할 상품이 공개 목록에 떠 있습니다. 대시보드에서 확인하세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
