name: 네이버 키워드 동기화 호출

# api/sync-naver-keywords.js(Vercel 서버리스 함수)를 주기적으로 깨웁니다.
# sync-naver-ads와 마찬가지로 Vercel Cron 2개 한도를 이미 다 쓰고 있어서
# GitHub Actions가 대신 호출합니다. 키워드 단위라 시간이 더 걸릴 수 있어
# 광고비 동기화보다 늦은 시각에 실행합니다.

on:
  schedule:
    # 매일 UTC 05:00 (KST 14:00)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      month:
        description: '지난 달 데이터를 채우고 싶을 때 등, 특정 월을 지정 (예: 2026-08). 비워두면 이번 달.'
        required: false
        default: ''
      debug:
        description: '벌크 통계 원본 응답을 로그에 출력 (문제 확인용)'
        type: boolean
        default: false

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      # 계정을 한 번의 호출에 다 처리하면 캠페인→광고그룹→키워드까지 내려가는 시간이
      # 계정 수만큼 늘어나 Vercel 함수 실행 제한(60초)을 넘기기 쉽다(계정2 추가 후 실제로
      # FUNCTION_INVOCATION_TIMEOUT 발생). 계정별로 별도 호출로 나눴는데도 계정2는 혼자서도
      # 60초를 넘겨서(쇼핑검색 자동 생성 키워드 등으로 캠페인/키워드가 훨씬 많음), 계정2는
      # 활동 캠페인을 4조각으로 더 쪼개 병렬로 처리한다(?shard=&shards=). 계정1은 35초 안에
      # 끝나서 안 쪼갠다. 계속 타임아웃 나면 shards 숫자를 더 늘리면 된다.
      fail-fast: false
      matrix:
        include:
          - account: '1'
            shard: 0
            shards: 1
          - account: '2'
            shard: 0
            shards: 4
          - account: '2'
            shard: 1
            shards: 4
          - account: '2'
            shard: 2
            shards: 4
          - account: '2'
            shard: 3
            shards: 4
    steps:
      - name: "Vercel sync 엔드포인트 호출 (계정${{ matrix.account }}, 조각 ${{ matrix.shard }}/${{ matrix.shards }})"
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DEBUG="${{ github.event.inputs.debug }}"
          URL="${{ secrets.VERCEL_APP_URL }}/api/sync-naver-keywords"
          QUERY="account=${{ matrix.account }}&shard=${{ matrix.shard }}&shards=${{ matrix.shards }}"
          if [ -n "$MONTH" ]; then QUERY="${QUERY}&month=${MONTH}"; fi
          if [ "$DEBUG" = "true" ]; then QUERY="${QUERY}&debug=1"; fi
          URL="${URL}?${QUERY}"
          HTTP_CODE=$(curl -s --max-time 90 -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$URL")
          echo "HTTP status: $HTTP_CODE"
          cat response.json
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then exit 1; fi
