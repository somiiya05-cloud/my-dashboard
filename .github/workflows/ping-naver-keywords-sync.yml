name: 네이버 키워드 동기화 호출

# api/sync-naver-keywords.js(Vercel 서버리스 함수)를 주기적으로 깨웁니다.
# sync-naver-ads와 마찬가지로 Vercel Cron 2개 한도를 이미 다 쓰고 있어서
# GitHub Actions가 대신 호출합니다. 키워드 단위라 시간이 더 걸릴 수 있어
# 광고비 동기화보다 늦은 시각에 실행합니다.

on:
  schedule:
    # 매일 UTC 05:00 (KST 14:00)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      month:
        description: '지난 달 데이터를 채우고 싶을 때 등, 특정 월을 지정 (예: 2026-08). 비워두면 이번 달.'
        required: false
        default: ''
      debug:
        description: '벌크 통계 원본 응답을 로그에 출력 (문제 확인용)'
        type: boolean
        default: false

# ⚠ 2026-09-12: 이 워크플로가 2026-09-10 이후 15번 연속 실패했다.
#   원인은 네이버 광고 API 호출 한도 — `GET /ncc/keywords (429) Too Many Requests`.
#   계정2 조각 6개가 **동시에** 같은 네이버 계정을 때리는 데다, 대시보드의
#   「지금 동기화」 버튼은 월 단위 워크플로(ping-naver-keywords-sync.yml)까지
#   같이 띄워서 한 계정에 최대 12조각이 한꺼번에 붙었다.
#   그래서 (1) 두 워크플로를 같은 concurrency 그룹으로 묶어 절대 겹치지 않게 하고,
#          (2) matrix 를 max-parallel: 1 로 바꿔 조각을 하나씩 순서대로 돌린다.
#   조각당 최대 90초라 전부 도는 데 몇 분 더 걸리지만, 실패해서 아무것도 안 들어오는
#   것보다 낫다. 한도가 늘어나면 max-parallel 을 2~3 으로 올려보면 된다.
concurrency:
  group: naver-keywords-sync
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1   # 조각을 동시에 돌리면 네이버 API 429 (위 설명 참고)
      # 계정을 한 번의 호출에 다 처리하면 캠페인→광고그룹→키워드까지 내려가는 시간이
      # 계정 수만큼 늘어나 Vercel 함수 실행 제한(60초)을 넘기기 쉽다(계정2 추가 후 실제로
      # FUNCTION_INVOCATION_TIMEOUT 발생). 계정별로 별도 호출로 나눴는데도 계정2는 혼자서도
      # 60초를 넘겨서(쇼핑검색 자동 생성 키워드 등으로 캠페인/키워드가 훨씬 많음), 계정2는
      # 활동 캠페인을 6조각으로 더 쪼개 병렬로 처리한다(?shard=&shards=). 계정1은 35초 안에
      # 끝나서 안 쪼갠다(4조각이던 걸 2026-09-11에 6조각으로 늘림 — 조각별 캠페인 수가
      # 고르게 안 나뉘어 특정 조각만 매번 타임아웃 나는 문제가 있었음). 계속 타임아웃 나면
      # shards 숫자를 더 늘리면 된다.
      fail-fast: false
      matrix:
        include:
          - account: '1'
            shard: 0
            shards: 1
          - account: '2'
            shard: 0
            shards: 6
          - account: '2'
            shard: 1
            shards: 6
          - account: '2'
            shard: 2
            shards: 6
          - account: '2'
            shard: 3
            shards: 6
          - account: '2'
            shard: 4
            shards: 6
          - account: '2'
            shard: 5
            shards: 6
    steps:
      - name: "Vercel sync 엔드포인트 호출 (계정${{ matrix.account }}, 조각 ${{ matrix.shard }}/${{ matrix.shards }})"
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DEBUG="${{ github.event.inputs.debug }}"
          URL="${{ secrets.VERCEL_APP_URL }}/api/sync-naver-keywords"
          QUERY="account=${{ matrix.account }}&shard=${{ matrix.shard }}&shards=${{ matrix.shards }}"
          if [ -n "$MONTH" ]; then QUERY="${QUERY}&month=${MONTH}"; fi
          if [ "$DEBUG" = "true" ]; then QUERY="${QUERY}&debug=1"; fi
          URL="${URL}?${QUERY}"
          HTTP_CODE=$(curl -s --max-time 90 -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$URL")
          echo "HTTP status: $HTTP_CODE"
          cat response.json
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then exit 1; fi
