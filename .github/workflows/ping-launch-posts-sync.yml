name: 런칭 글 건수 동기화 호출

# Vercel Hobby 플랜의 cron 2개 한도를 이미 다 쓰고 있어서(sync-meta-ads, sync-ezadmin-inventory),
# 다른 동기화들과 마찬가지로 GitHub Actions가 주기적으로 엔드포인트를 호출해 실행합니다.
# 실제 로직은 전부 api/sync-launch-posts.js 안에 있고, 여기서는 깨우기만 합니다.

on:
  schedule:
    # 시각은 전부 KST 기준입니다. GitHub Actions 는 UTC로 도니 -9시간 해서 적었습니다.
    #
    # 매시간(하루 24번)으로 걸어봤지만 오히려 더 자주 걸렀습니다. GitHub은 예약 실행을
    # 최선 노력으로만 돌리고 몰릴수록 버리기 때문에, 촘촘히 걸수록 손해였습니다.
    # 그래서 횟수를 줄이고 "메일이 온 뒤" 시간대에 몰아 넣었습니다.
    # 분도 0분·5분처럼 다들 쓰는 시각을 피해 흩어 놓았습니다(그 시각이 가장 많이 밀립니다).
    #
    # SCM 미출 메일은 오후 늦게 옵니다. 15시엔 없고 19시엔 있던 날이 많아 저녁에 몰았습니다.
    - cron: '17 9 * * *'    # 18:17
    - cron: '43 10 * * *'   # 19:43
    - cron: '23 12 * * *'   # 21:23
    - cron: '47 13 * * *'   # 22:47
    # 런칭 글 건수는 업무시간에도 봐야 해서 오전·오후 한 번씩 둡니다.
    - cron: '17 1 * * *'    # 10:17
    - cron: '37 5 * * *'    # 14:37
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식'
        required: true
        type: choice
        default: '저장 (배지에 반영)'
        options:
          - '저장 (배지에 반영)'
          - '확인만 (저장 안 함 · 폴더와 메일 제목 보기)'
      mailbox:
        description: '볼 메일 폴더 이름 (비워두면 INBOX). 평소에는 비워두세요.'
        required: false
        default: ''

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel sync 엔드포인트 호출
        run: |
          URL="${{ secrets.VERCEL_APP_URL }}/api/sync-launch-posts"
          MODE="${{ github.event.inputs.mode }}"
          MAILBOX="${{ github.event.inputs.mailbox }}"
          SEP="?"
          # 스케줄 실행은 mode가 비어 있으므로 항상 저장 모드로 돕니다.
          case "$MODE" in
            확인만*) URL="${URL}${SEP}debug=1"; SEP="&" ;;
          esac
          if [ -n "$MAILBOX" ]; then
            ENCODED=$(printf '%s' "$MAILBOX" | od -An -tx1 | tr -d ' \n' | sed 's/../%&/g')
            URL="${URL}${SEP}mailbox=${ENCODED}"
          fi
          HTTP_CODE=$(curl -s --max-time 90 -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$URL")
          echo "HTTP status: $HTTP_CODE"
          cat response.json
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then exit 1; fi
