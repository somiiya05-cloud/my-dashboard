name: 메타 광고 동기화 호출

# 메타 광고 동기화(api/sync-meta-ads)는 Vercel cron 이 매일 KST 07:00 에 돌린다.
# 이 워크플로는 그 사이에 손으로 한 번 더 돌리고 싶을 때(Actions 탭 → Run workflow) 쓴다.
# 같이 받는 「지금 켜진 메타 광고」(meta_active_ads)가 실시간 매출 쿠팡 탭의 「메타」 뱃지가 된다.

on:
  workflow_dispatch:
    inputs:
      month:
        description: '특정 월(예: 2026-08). 비워두면 이번 달.'
        required: false
        default: ''

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel sync 엔드포인트 호출
        run: |
          MONTH="${{ github.event.inputs.month }}"
          URL="${{ secrets.VERCEL_APP_URL }}/api/sync-meta-ads"
          if [ -n "$MONTH" ]; then URL="${URL}?month=${MONTH}"; fi
          HTTP_CODE=$(curl -s --max-time 90 -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$URL")
          echo "HTTP status: $HTTP_CODE"
          cat response.json
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then exit 1; fi
